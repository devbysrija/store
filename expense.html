<!DOCTYPE html>
<html ng-app="expenseApp">
<head>
    <title>Expense Tracker</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
            background: #f2f2f2;
        }
        .box {
            background: white;
            padding: 20px;
            max-width: 650px;
            margin: auto;
            border-radius: 8px;
        }
        input, select, button {
            padding: 8px;
            margin: 5px;
        }
        button {
            background: green;
            color: white;
            border: none;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        td, th {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

<body ng-controller="ExpenseController">
<div class="box">
    <h2>Expense Tracker</h2>

    <form ng-submit="addExpense()">
        <input ng-model="newExpense.name" placeholder="Expense Name" required>
        <input type="number" ng-model="newExpense.amount"
               placeholder="Amount" min="0.01" step="0.01" required>

        <select ng-model="newExpense.category" required>
            <option value="">Select Category</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Other</option>
        </select>

        <input type="date" ng-model="newExpense.date" required>
        <button type="submit">Add Expense</button>
    </form>

    <h3>Total: ₹{{ total() }}</h3>

    <input ng-model="searchText" placeholder="Search expense">

    <select ng-model="selectedCategory">
        <option value="">All Categories</option>
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Other</option>
    </select>

    <table>
        <tr>
            <th>Name</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
        </tr>

        <tr ng-repeat="e in expenses | filter:searchText | categoryFilter:selectedCategory">
            <td>{{e.name}}</td>
            <td>₹{{e.amount}}</td>
            <td>{{e.category}}</td>
            <td>{{e.date | date:'dd-MM-yyyy'}}</td>
        </tr>
    </table>
</div>

<script>
var app = angular.module('expenseApp', []);

app.service('ExpenseService', function($http) {
    this.getExpenses = function() {
        return $http.get('/expenses');
    };

    this.addExpense = function(expense) {
        return $http.post('/expenses', expense);
    };
});

app.filter('categoryFilter', function() {
    return function(expenses, category) {
        if (!category) return expenses;

        return expenses.filter(function(e) {
            return e.category === category;
        });
    };
});

app.controller('ExpenseController', function($scope, ExpenseService) {
    $scope.expenses = [];
    $scope.newExpense = {};
    $scope.selectedCategory = '';

    function loadExpenses() {
        ExpenseService.getExpenses().then(function(response) {
            $scope.expenses = response.data;
        });
    }

    $scope.addExpense = function() {
        var expense = angular.copy($scope.newExpense);
        expense.date = new Date(expense.date).toISOString();

        ExpenseService.addExpense(expense).then(function() {
            $scope.newExpense = {};
            loadExpenses();
        });
    };

    $scope.total = function() {
        return $scope.expenses.reduce(function(sum, e) {
            return sum + (Number(e.amount) || 0);
        }, 0).toFixed(2);
    };

    loadExpenses();
});
</script>
</body>
</html>
